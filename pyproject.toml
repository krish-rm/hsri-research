[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsri-agents"
version = "0.1.0"
description = "Multi-agent evidence-review and adversarial debate pipeline for HSRI"
readme = "hsri_agents/README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "requests>=2.28.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.39.0",
]

[project.scripts]
hsri-agents = "hsri_agents.cli:main"
hsri-engine = "hsri_engine.cli:main"

[tool.setuptools.packages.find]
include = ["hsri_agents*", "hsri_engine*"]
