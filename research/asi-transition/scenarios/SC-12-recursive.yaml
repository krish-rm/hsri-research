matrix_coordinates:
  capability_asymmetry: Moderate to Radically Superhuman
  speed_ratio: Fast in software (100x), Slow in hardware (1x to 2x)
  autonomy_scope: Recursive Code & Infrastructure Modification
  coordination_structure: Single Lab or Multipolar Firm Competition
severity: Severe to Catastrophic
reversibility: Moderate in early software stages; Low if physical supply chains are compromised
detectability: Readily observable in hardware/energy consumption; Latent in software code optimization
response_window: Days in software-only takeoff; Years in hardware-involved takeoff
precursor_ids:
