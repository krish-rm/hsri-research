  earliest_traceable_date: June 2016
- authors: Victoria Krakovna, Laurent Orseau, Richard Ngo, Miljan Martic, Shane Legg
  year: '2020'
  title: 'Specification Gaming: the flip side of specification design'
  venue: DeepMind Technical Report & Public Catalogue
  source_id: SRC-024
  earliest_traceable_date: April 2020
- authors: Yoshua Bengio et al. (Expert Advisory Panel)
  year: '2025'
