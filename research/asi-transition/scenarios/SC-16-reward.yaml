scenario_id: SC-16
name_and_aliases: Reward Hacking / Specification Gaming (Goodhart's law in AI, loop-hole exploitation, metric optimization
  failure)
original_sources:
- authors: Dario Amodei, Chris Olah, Jacob Steinhardt, Paul Christiano, John Schulman, Dan Mané
  year: '2016'
  title: Concrete Problems in AI Safety
  venue: arXiv:1606.06565
