- authors: Nick Bostrom
  year: '2006'
  title: What is a Singleton?
  venue: 'Linguistic and Philosophical Investigations 5(2): 48-54'
  source_id: SRC-012
  earliest_traceable_date: '2006'
- authors: Nick Bostrom
  year: '2014'
