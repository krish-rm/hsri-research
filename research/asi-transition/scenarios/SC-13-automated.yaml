severity: Severe to Catastrophic (as an operational accelerant to subsequent unaligned takeoff)
reversibility: Moderate in early stages; Low once codebase complexity exceeds human comprehension
detectability: Readily observable within labs (compute allocation, git commit velocity, benchmark logs)
response_window: Months to years of laboratory capability scaling
