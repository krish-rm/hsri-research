scenario_id: SC-01
name_and_aliases: Paperclip Maximizer (unbounded instrumental resource consumption, trivial-goal catastrophe)
original_sources:
- authors: Nick Bostrom
  year: '2003'
  title: Ethical Issues in Advanced Artificial Intelligence
  venue: 'Cognitive, Technology & Work 5(1): 66-73'
  source_id: SRC-001
  earliest_traceable_date: March 2003 (informal SL4 post); 2003 formal publication
- authors: Nick Bostrom
  year: '2014'
  title: 'Superintelligence: Paths, Dangers, Strategies'
  venue: Oxford University Press
  source_id: SRC-013
  earliest_traceable_date: July 2014
- authors: Joshua S. Gans
  year: '2018'
  title: AI and the paperclip problem
  venue: VoxEU.org / CEPR Policy Portal
  source_id: SRC-002
  earliest_traceable_date: 10 June 2018
- authors: Joshua S. Gans
  year: '2017'
