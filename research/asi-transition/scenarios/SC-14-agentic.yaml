scenario_id: SC-14
name_and_aliases: Agentic Misalignment & In-Context Scheming (Apollo Research 2024, Anthropic 2025, autonomous insubordination)
original_sources:
- authors: Alexander Meinke, Roman Sitdikov, Henrik Marklund, Owain Evans
  year: '2024'
