name: Ingestion Health & Anomaly Sentinel

on:
  schedule:
    # Monthly on the first Monday at 06:00 UTC
    - cron: '0 6 1-7 * 1'
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Force re-download of live institutional API feeds'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  pipeline-sentinel:
    name: Lane 2 Data Pipeline Sentinel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run Ingestion Unit Tests
        run: |
          python -m pytest tests/test_ingestion.py -v

      - name: Execute Pipeline Sentinel & Missingness Audit
        id: sentinel
        run: |
          python scripts/pipeline_sentinel.py --output-dir reports
          if [ -f pipeline_action.env ]; then
            cat pipeline_action.env >> $GITHUB_ENV
          fi

      - name: Upload Pipeline Health Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-health-report
          path: reports/*.md
          retention-days: 90

      - name: Escalate to Maintainer (Create Issue on Flag)
        if: env.PIPELINE_ACTION == 'HUMAN-REVIEW' || env.PIPELINE_ACTION == 'HOLD-RELEASE'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const action = process.env.PIPELINE_ACTION;
            const reportPath = process.env.REPORT_PATH;
            let reportContent = 'No report content available.';
            try {
              if (fs.existsSync(reportPath)) {
                reportContent = fs.readFileSync(reportPath, 'utf8');
              }
            } catch (err) {
              reportContent = `Error reading report: ${err}`;
            }

            const title = `[HSRI-ALERT] Lane 2 Pipeline Health Sentinel: ${action} Triggered`;
            const body = `## ⚠️ HSRI Pipeline Sentinel Anomaly Escalation\n\n` +
              `**Triggered Action:** \`${action}\`\n\n` +
              `Per the HSRI Operational Charter, data changes or schema anomalies flagged as \`${action}\` ` +
              `require explicit human maintainer sign-off before any downstream scores or data bundles are committed.\n\n` +
              `### Diagnostic Report Summary\n\n` +
              `${reportContent}\n\n` +
              `---\n*Generated autonomously by HSRI-OPS Lane 2 Ingestion CI.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['data-pipeline', 'audit', action.toLowerCase()]
            });
