name: Deploy Web Portal and Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install mkdocs-material

      - name: Install Node dependencies
        run: |
          cd site-astro
          npm install

      - name: Build Astro web portal
        run: |
          cd site-astro
          npm run build

      - name: Build MkDocs documentation into web portal
        run: mkdocs build --strict -d site-astro/dist/docs

      - name: Ensure .nojekyll exists
        run: touch site-astro/dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-astro/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Post-deploy smoke test
        run: |
          sleep 30  # Allow Pages CDN to propagate
          python - <<'EOF'
          import urllib.request, sys, re, time

          url = "https://krish-rm.github.io/hsri-research/"
          max_attempts = 5

          for attempt in range(max_attempts):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")

                  checks = {
                      "pagination_label": "Showing 10 of 39 countries" in html,
                      "footer_methodology": "/hsri-research/methodology/" in html,
                      "footer_countries": "/hsri-research/countries/" in html,
                      "coverage_in_disclaimer": "/hsri-research/coverage/" in html,
                  }

                  # Check coverage page reachable and rendered
                  cov_req = urllib.request.Request("https://krish-rm.github.io/hsri-research/coverage/", headers={"Cache-Control": "no-cache"})
                  cov_res = urllib.request.urlopen(cov_req, timeout=15)
                  cov_html = cov_res.read().decode("utf-8")
                  checks["coverage_page_200"] = (cov_res.getcode() == 200)
                  checks["coverage_page_content"] = "Global Geographic Coverage" in cov_html

                  csv_urls = [
                      "https://krish-rm.github.io/hsri-research/downloads/hsri-country-scores.csv",
                      "https://krish-rm.github.io/hsri-research/downloads/hsri-normalized-indicators.csv",
                      "https://krish-rm.github.io/hsri-research/downloads/hsri-evidence-table.csv",
                      "https://krish-rm.github.io/hsri-research/downloads/hsri-unrated-nations.csv",
                  ]
                  for c_url in csv_urls:
                      c_req = urllib.request.Request(c_url, headers={"Cache-Control": "no-cache"})
                      res = urllib.request.urlopen(c_req, timeout=15)
                      checks[f"download_{c_url.split('/')[-1]}"] = (res.getcode() == 200)

                  failed = [k for k, v in checks.items() if not v]
                  if not failed:
                      print("All smoke tests passed.")
                      sys.exit(0)
                  else:
                      print(f"Attempt {attempt+1}/{max_attempts} — failed: {failed}")
                      if attempt < max_attempts - 1:
                          time.sleep(30)
              except Exception as e:
                  print(f"Attempt {attempt+1} error: {e}")
                  if attempt < max_attempts - 1:
                      time.sleep(30)

          print("SMOKE TEST FAILED after all attempts.")
          sys.exit(1)
          EOF

