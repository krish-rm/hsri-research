name: Deploy Web Portal and Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install mkdocs-material

      - name: Install Node dependencies
        run: |
          cd site-astro
          npm ci

      - name: Build Astro web portal
        run: |
          cd site-astro
          npm run build

      - name: Build MkDocs documentation into web portal
        run: mkdocs build --strict -d site-astro/dist/docs

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-astro/dist
          publish_branch: gh-pages
          force_orphan: true
