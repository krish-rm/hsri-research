name: Deploy Web Portal and Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install mkdocs-material

      - name: Install Node dependencies
        run: |
          cd site-astro
          npm install

      - name: Build Astro web portal
        run: |
          cd site-astro
          npm run build

      - name: Build MkDocs documentation into web portal
        run: mkdocs build --strict -d site-astro/dist/docs

      - name: Ensure .nojekyll exists
        run: touch site-astro/dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-astro/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Post-deploy smoke test
        run: |
          sleep 30  # Allow Pages CDN to propagate
          python - <<'EOF'
          import urllib.request, sys, re, time

          base_url = "https://krish-rm.github.io/hsri-research/"
          max_attempts = 5

          for attempt in range(max_attempts):
              try:
                  req = urllib.request.Request(base_url, headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "HSRI-SmokeTest/5.0"
                  })
                  html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8")

                  # Use regex, not fragile exact string matching
                  pagination = re.search(r'Showing \d+ of (\d+) countries', html)
                  version = re.search(r'Preview Benchmark v(\d+\.\d+)', html)
                  footer_ok = bool(re.search(r'href="/hsri-research/methodology/', html))
                  coverage_ok = '/hsri-research/coverage/' in html

                  checks = {
                      "pagination_total_39": pagination and int(pagination.group(1)) == 39,
                      "version_is_v02_or_later": version and float(version.group(1)) >= 0.2,
                      "footer_base_url_correct": footer_ok,
                      "coverage_link_present": coverage_ok,
                  }

                  # Check coverage page reachable and rendered
                  cov_req = urllib.request.Request(f"{base_url}coverage/", headers={"Cache-Control": "no-cache", "User-Agent": "HSRI-SmokeTest/5.0"})
                  cov_res = urllib.request.urlopen(cov_req, timeout=15)
                  cov_html = cov_res.read().decode("utf-8")
                  checks["coverage_page_200"] = (cov_res.getcode() == 200)
                  checks["coverage_page_content"] = "Global Geographic Coverage" in cov_html

                  # Check research-updates page reachable and rendered
                  ru_req = urllib.request.Request(f"{base_url}research-updates/", headers={"Cache-Control": "no-cache", "User-Agent": "HSRI-SmokeTest/5.0"})
                  ru_res = urllib.request.urlopen(ru_req, timeout=15)
                  ru_html = ru_res.read().decode("utf-8")
                  checks["research_updates_200"] = (ru_res.getcode() == 200)
                  checks["research_updates_content"] = "Literature Digests" in ru_html

                  # Check methodology page reachable and contains behavioral experiment pipeline
                  meth_req = urllib.request.Request(f"{base_url}methodology/", headers={"Cache-Control": "no-cache", "User-Agent": "HSRI-SmokeTest/5.0"})
                  meth_res = urllib.request.urlopen(meth_req, timeout=15)
                  methodology_html = meth_res.read().decode("utf-8")
                  checks["methodology_page_200"] = (meth_res.getcode() == 200)
                  checks["exp_pipeline_on_methodology"] = (
                      "EXP-01" in methodology_html and "PROCEED TO IRB" in methodology_html
                  )

                  csv_urls = [
                      f"{base_url}downloads/hsri-country-scores.csv",
                      f"{base_url}downloads/hsri-normalized-indicators.csv",
                      f"{base_url}downloads/hsri-evidence-table.csv",
                      f"{base_url}downloads/hsri-unrated-nations.csv",
                      f"{base_url}downloads/model-divergence-log.csv",
                  ]
                  for c_url in csv_urls:
                      c_req = urllib.request.Request(c_url, headers={"Cache-Control": "no-cache", "User-Agent": "HSRI-SmokeTest/5.0"})
                      res = urllib.request.urlopen(c_req, timeout=15)
                      checks[f"download_{c_url.split('/')[-1]}"] = (res.getcode() == 200)

                  checks["divergence_log_200"] = checks.get("download_model-divergence-log.csv", False)

                  failed = [k for k, v in checks.items() if not v]
                  if not failed:
                      print(f"All smoke tests passed. version={version.group(1)}, pagination_total={pagination.group(1)}")
                      sys.exit(0)
                  else:
                      print(f"Attempt {attempt+1}/{max_attempts} — failed: {failed}")
                      if attempt < max_attempts - 1:
                          time.sleep(30)
              except Exception as e:
                  print(f"Attempt {attempt+1} error: {e}")
                  if attempt < max_attempts - 1:
                      time.sleep(30)

          print("SMOKE TEST FAILED after all attempts.")
          sys.exit(1)
          EOF

