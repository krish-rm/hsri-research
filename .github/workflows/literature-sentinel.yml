name: HSRI Literature Sentinel
on:
  schedule:
    - cron: '0 7 * * 1'   # Every Monday 07:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python scripts/literature_sentinel.py
      - uses: actions/upload-artifact@v4
        with:
          name: literature-digest-${{ github.run_id }}
          path: research/evidence/weekly-digest-*.md
          retention-days: 90
      - name: Commit literature log
        run: |
          git config user.name "hsri-ops[bot]"
          git config user.email "hsri-ops@users.noreply.github.com"
          git add research/evidence/literature-log.jsonl
          git add research/evidence/weekly-digest-*.md
          git diff --staged --quiet || git commit -m "data(literature): weekly sentinel scan $(date +%Y-W%V)"
          git push
